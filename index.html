<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MaiGacha</title>
  <link rel="icon" type="image/x-icon" href="/Images/Favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink:    #ff7eb3;
      --lavender:#c9a0f5;
      --sky:     #6ec6ff;
      --mint:    #7ee8c8;
      --yellow:  #ffe066;
      --white:   #ffffff;
      --card-bg: rgba(255,255,255,0.18);
      --shadow:  0 8px 32px rgba(180,100,255,0.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #1a0533 0%, #0d1a3a 40%, #0a2a1a 100%);
      overflow-x: hidden;
      position: relative;
    }

    /* ─── Animated starfield ───────────────────────────────── */
    #stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--dur) ease-in-out infinite alternate;
      opacity: 0;
    }
    @keyframes twinkle {
      0%   { opacity: 0;   transform: scale(0.6); }
      100% { opacity: 0.9; transform: scale(1.2); }
    }

    /* ─── Floating bubbles ─────────────────────────────────── */
    .bubble {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.18;
      animation: drift var(--d) ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(var(--tx), var(--ty)) scale(1.15); }
    }

    /* ─── Screens ──────────────────────────────────────────── */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
    }

    /* ════════════════════════════════════════════════════════
       TITLE SCREEN
    ════════════════════════════════════════════════════════ */
    #titleScreen {
      gap: 0;
    }

    .title-logo {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(3.5rem, 10vw, 7rem);
      background: linear-gradient(135deg, var(--pink) 0%, var(--lavender) 50%, var(--sky) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(201,160,245,0.6));
      letter-spacing: 2px;
      animation: logoFloat 3s ease-in-out infinite;
      line-height: 1;
      margin-bottom: 4px;
    }
    @keyframes logoFloat {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }

    .title-sub {
      color: rgba(255,255,255,0.55);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
    }

    /* Mascot orb */
    .mascot-wrap {
      position: relative;
      width: 200px;
      height: 200px;
      margin-bottom: 2.5rem;
    }
    .mascot-glow {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,160,245,0.35) 0%, transparent 70%);
      animation: pulseGlow 2s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%,100% { transform: scale(1);    opacity: 0.8; }
      50%      { transform: scale(1.15); opacity: 1; }
    }
    .mascot-orb {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,126,179,0.3), rgba(201,160,245,0.3), rgba(110,198,255,0.3));
      border: 2px solid rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 40px rgba(201,160,245,0.4), inset 0 0 40px rgba(255,255,255,0.05);
      transition: transform 0.15s ease;
    }
    .mascot-orb:hover { transform: scale(1.05); }
    .mascot-orb:active { transform: scale(0.94); }
    .mascot-orb img {
      width: 140px;
      height: 140px;
      object-fit: contain;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }

    /* Rings */
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid;
      animation: spinRing var(--rs) linear infinite;
    }
    @keyframes spinRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* Start button */
    .start-btn {
      position: relative;
      padding: 1rem 3.5rem;
      font-family: 'Fredoka One', cursive;
      font-size: 1.4rem;
      letter-spacing: 2px;
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--lavender));
      border: none;
      border-radius: 60px;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(255,126,179,0.5), 0 4px 20px rgba(0,0,0,0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .start-btn::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.25) 50%, transparent 70%);
      animation: shimmer 2.5s linear infinite;
    }
    @keyframes shimmer { from { transform: translateX(-100%) rotate(15deg); } to { transform: translateX(100%) rotate(15deg); } }
    .start-btn:hover { transform: translateY(-4px) scale(1.04); box-shadow: 0 0 50px rgba(255,126,179,0.7), 0 8px 30px rgba(0,0,0,0.3); }
    .start-btn:active { transform: scale(0.97); }

    /* ════════════════════════════════════════════════════════
       CLICKER SCREEN
    ════════════════════════════════════════════════════════ */
    #clickerScreen {
      gap: 0;
    }

    /* Top HUD */
    .hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: rgba(10,5,30,0.7);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 100;
    }
    .hud-title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.5rem;
      background: linear-gradient(135deg, var(--pink), var(--lavender));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hud-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .click-counter {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,0.08);
      padding: 8px 16px;
      border-radius: 50px;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .click-icon { font-size: 1.2rem; }
    .click-value {
      font-family: 'Fredoka One', cursive;
      font-size: 1.3rem;
      color: var(--yellow);
      min-width: 70px;
      text-align: right;
      transition: transform 0.1s;
    }
    .click-value.pop { animation: countPop 0.2s ease; }
    @keyframes countPop {
      0%  { transform: scale(1); }
      50% { transform: scale(1.1); color: #fff; }
      100%{ transform: scale(1); }
    }

    /* Gacha & Shop buttons in HUD */
    .gacha-hud-btn, .shop-hud-btn {
      padding: 8px 20px;
      font-family: 'Fredoka One', cursive;
      font-size: 1rem;
      color: #fff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .gacha-hud-btn {
      background: linear-gradient(135deg, var(--lavender), var(--sky));
      box-shadow: 0 0 20px rgba(110,198,255,0.4);
    }
    .shop-hud-btn {
      background: linear-gradient(135deg, var(--mint), var(--yellow));
      box-shadow: 0 0 20px rgba(126,232,200,0.4);
      color: #1a0533;
    }
    .gacha-hud-btn:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(110,198,255,0.6); }
    .shop-hud-btn:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(126,232,200,0.6); }

    /* Character select button */
    .char-select-btn {
      padding: 8px 16px;
      font-family: 'Fredoka One', cursive;
      font-size: 0.9rem;
      color: #fff;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s;
    }
    .char-select-btn:hover {
      background: rgba(255,255,255,0.2);
      border-color: rgba(255,255,255,0.4);
    }

    /* Clicker area */
    .clicker-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 90px;
    }

    .click-prompt {
      color: rgba(255,255,255,0.5);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      animation: blink 1.5s ease-in-out infinite;
    }
    @keyframes blink { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

    /* Boost indicator */
    .boost-indicator {
      position: absolute;
      top: -10px;
      right: -10px;
      background: linear-gradient(135deg, var(--mint), var(--yellow));
      color: #1a0533;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 1px;
      box-shadow: 0 0 20px rgba(126,232,200,0.6);
      animation: pulse 1s ease-in-out infinite;
      z-index: 10;
    }
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    /* The clickable character */
    .clicker-btn {
      position: relative;
      width: 240px;
      height: 240px;
      cursor: pointer;
      user-select: none;
    }
    .clicker-aura {
      position: absolute;
      inset: -16px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,126,179,0.2) 0%, transparent 70%);
      animation: auraPulse 1.5s ease-in-out infinite;
    }
    @keyframes auraPulse {
      0%,100% { transform: scale(1);    opacity: 0.6; }
      50%      { transform: scale(1.12); opacity: 1; }
    }
    .clicker-circle {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: linear-gradient(135deg,
        rgba(255,126,179,0.25) 0%,
        rgba(201,160,245,0.25) 50%,
        rgba(110,198,255,0.25) 100%);
      border: 2px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(20px);
      box-shadow: 0 0 60px rgba(201,160,245,0.3), inset 0 0 60px rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      position: relative;
      overflow: hidden;
    }
    .clicker-circle img {
      width: 175px;
      height: 175px;
      object-fit: contain;
      pointer-events: none;
      transition: transform 0.08s ease;
      filter: drop-shadow(0 8px 20px rgba(255,126,179,0.4));
    }
    .clicker-btn:active .clicker-circle {
      transform: scale(0.92);
      box-shadow: 0 0 80px rgba(255,126,179,0.5), inset 0 0 80px rgba(255,255,255,0.08);
    }
    .clicker-btn:active .clicker-circle img {
      transform: scale(0.9) rotate(-5deg);
    }

    /* Outer rings on clicker */
    .clicker-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.08);
      pointer-events: none;
    }

    /* Progress bar */
    .progress-wrap {
      width: 260px;
    }
    .progress-labels {
      display: flex;
      justify-content: space-between;
      color: rgba(255,255,255,0.45);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(255,255,255,0.08);
      border-radius: 50px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 50px;
      background: linear-gradient(90deg, var(--pink), var(--lavender), var(--sky));
      transition: width 0.3s ease;
      box-shadow: 0 0 10px rgba(201,160,245,0.6);
    }

    /* Floating click numbers */
    .float-num {
      position: fixed;
      font-family: 'Fredoka One', cursive;
      font-size: 1.8rem;
      color: var(--yellow);
      pointer-events: none;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      animation: floatUp 0.8s ease-out forwards;
      z-index: 999;
    }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-80px) scale(0.5); }
    }

    /* Particles */
    .spark {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      animation: spark 0.5s ease-out forwards;
      z-index: 998;
    }
    @keyframes spark {
      0%   { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--sx),var(--sy)) scale(0.2); }
    }

    /* ════════════════════════════════════════════════════════
       GACHA MODAL
    ════════════════════════════════════════════════════════ */
    #gachaModal {
      position: fixed;
      inset: 0;
      background: rgba(5,2,20,0.88);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #gachaModal.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal-inner {
      width: min(900px, 95vw);
      background: linear-gradient(135deg, rgba(30,10,60,0.95), rgba(10,25,60,0.95));
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 0 80px rgba(201,160,245,0.2);
      animation: modalIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes modalIn {
      from { transform: scale(0.85) translateY(30px); opacity: 0; }
      to   { transform: scale(1) translateY(0);       opacity: 1; }
    }

    .modal-header {
      padding: 20px 28px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .modal-title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.6rem;
      background: linear-gradient(135deg, var(--pink), var(--lavender));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .close-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.6);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
    }
    .close-btn:hover { background: rgba(255,80,80,0.2); color: #fff; }

    /* Banner tabs */
    .banner-tabs {
      display: flex;
      gap: 10px;
      padding: 16px 28px;
      overflow-x: auto;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .banner-tab {
      padding: 8px 20px;
      border-radius: 50px;
      border: 1.5px solid rgba(255,255,255,0.15);
      background: transparent;
      color: rgba(255,255,255,0.5);
      font-family: 'Nunito', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .banner-tab.active {
      background: linear-gradient(135deg, var(--lavender), var(--sky));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 0 20px rgba(110,198,255,0.4);
    }
    .banner-tab:hover:not(.active) {
      border-color: rgba(255,255,255,0.35);
      color: #fff;
    }

    /* Modal body */
    .modal-body {
      display: flex;
      padding: 24px 28px;
      gap: 24px;
    }

    .banner-preview {
      flex: 1;
      min-width: 0;
    }
    .banner-img-wrap {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 16/9;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .banner-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .banner-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(5,2,20,0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 4px 10px;
      color: var(--yellow);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .banner-name {
      margin-top: 12px;
      color: rgba(255,255,255,0.8);
      font-weight: 800;
      font-size: 1.1rem;
    }
    .banner-desc {
      color: rgba(255,255,255,0.4);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    /* Spin panel */
    .spin-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 200px;
      flex-shrink: 0;
    }

    .spin-card {
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      transition: border-color 0.2s, background 0.2s;
    }
    .spin-card:hover { border-color: rgba(201,160,245,0.4); background: rgba(201,160,245,0.06); }
    .spin-card-title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 4px;
    }
    .spin-card-cost {
      color: var(--yellow);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    .spin-btn {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: none;
      font-family: 'Fredoka One', cursive;
      font-size: 1rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .spin-btn.single {
      background: linear-gradient(135deg, var(--pink), var(--lavender));
      color: #fff;
      box-shadow: 0 4px 16px rgba(255,126,179,0.4);
    }
    .spin-btn.multi {
      background: linear-gradient(135deg, var(--lavender), var(--sky));
      color: #fff;
      box-shadow: 0 4px 16px rgba(110,198,255,0.4);
    }
    .spin-btn:hover { transform: translateY(-2px); }
    .spin-btn:active { transform: scale(0.96); }
    .spin-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    .balance-display {
      background: rgba(255,230,100,0.08);
      border: 1px solid rgba(255,230,100,0.2);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    .balance-label {
      color: rgba(255,255,255,0.4);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .balance-value {
      font-family: 'Fredoka One', cursive;
      font-size: 1.8rem;
      color: var(--yellow);
    }

    /* ════════════════════════════════════════════════════════
       SHOP MODAL
    ════════════════════════════════════════════════════════ */
    #shopModal {
      position: fixed;
      inset: 0;
      background: rgba(5,2,20,0.88);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #shopModal.open {
      opacity: 1;
      pointer-events: all;
    }

    .shop-inner {
      width: min(700px, 95vw);
      background: linear-gradient(135deg, rgba(20,40,30,0.95), rgba(10,25,40,0.95));
      border: 1px solid rgba(126,232,200,0.2);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 0 80px rgba(126,232,200,0.2);
      animation: modalIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      padding: 24px;
    }

    .shop-item {
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      transition: all 0.2s;
      cursor: pointer;
    }
    .shop-item:hover {
      border-color: rgba(126,232,200,0.4);
      background: rgba(126,232,200,0.08);
      transform: translateY(-2px);
    }
    .shop-item.owned {
      border-color: rgba(126,232,200,0.6);
      background: rgba(126,232,200,0.12);
    }
    .shop-item-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }
    .shop-item-name {
      font-family: 'Fredoka One', cursive;
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 4px;
    }
    .shop-item-desc {
      color: rgba(255,255,255,0.5);
      font-size: 0.8rem;
      margin-bottom: 12px;
    }
    .shop-item-cost {
      font-family: 'Fredoka One', cursive;
      font-size: 1.3rem;
      color: var(--yellow);
      margin-bottom: 12px;
    }
    .shop-item-btn {
      padding: 8px 20px;
      border-radius: 12px;
      border: none;
      font-family: 'Fredoka One', cursive;
      font-size: 0.9rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      background: linear-gradient(135deg, var(--mint), var(--yellow));
      color: #1a0533;
      box-shadow: 0 4px 16px rgba(126,232,200,0.3);
    }
    .shop-item-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(126,232,200,0.5);
    }
    .shop-item-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .shop-item-btn.owned-btn {
      background: rgba(126,232,200,0.2);
      color: var(--mint);
      box-shadow: none;
    }

    /* ════════════════════════════════════════════════════════
       CHARACTER SELECT MODAL
    ════════════════════════════════════════════════════════ */
    #charSelectModal {
      position: fixed;
      inset: 0;
      background: rgba(5,2,20,0.88);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #charSelectModal.open {
      opacity: 1;
      pointer-events: all;
    }

    .char-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 16px;
      padding: 24px;
      max-height: 60vh;
      overflow-y: auto;
    }

    .char-card {
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .char-card:hover {
      border-color: rgba(201,160,245,0.4);
      background: rgba(201,160,245,0.08);
      transform: translateY(-2px);
    }
    .char-card.selected {
      border-color: var(--lavender);
      background: rgba(201,160,245,0.15);
      box-shadow: 0 0 20px rgba(201,160,245,0.3);
    }
    .char-card.locked {
      opacity: 0.3;
      pointer-events: none;
    }
    .char-card-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,126,179,0.2), rgba(201,160,245,0.2));
      border: 2px solid rgba(255,255,255,0.15);
      margin: 0 auto 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .char-card-circle img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }
    .char-card-name {
      font-size: 0.8rem;
      font-weight: 800;
      color: rgba(255,255,255,0.7);
    }
    .char-card-lock {
      font-size: 1.5rem;
      color: rgba(255,255,255,0.3);
    }

    /* ════════════════════════════════════════════════════════
       RESULT OVERLAY
    ════════════════════════════════════════════════════════ */
    #resultOverlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(30,10,80,0.97) 0%, rgba(5,2,20,0.98) 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #resultOverlay.open { opacity: 1; pointer-events: all; }

    .result-bg-rays {
      position: absolute;
      inset: 0;
      background: conic-gradient(from 0deg, transparent 0deg, rgba(255,126,179,0.06) 10deg, transparent 20deg, rgba(201,160,245,0.06) 30deg, transparent 40deg);
      animation: rotateSlow 8s linear infinite;
    }
    @keyframes rotateSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .result-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .result-rarity {
      font-family: 'Fredoka One', cursive;
      font-size: 1rem;
      letter-spacing: 6px;
      color: var(--yellow);
      text-shadow: 0 0 20px rgba(255,230,100,0.8);
      text-transform: uppercase;
      opacity: 0;
      animation: fadeSlideIn 0.5s 0.3s ease forwards;
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-img-wrap {
      position: relative;
      width: 220px;
      height: 220px;
    }
    .result-glow {
      position: absolute;
      inset: -30px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,126,179,0.4), transparent 70%);
      animation: resultGlow 1s ease-in-out infinite alternate;
    }
    @keyframes resultGlow {
      from { transform: scale(1); }
      to   { transform: scale(1.2); }
    }
    .result-img-circle {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,126,179,0.3), rgba(201,160,245,0.3));
      border: 3px solid rgba(255,255,255,0.3);
      box-shadow: 0 0 60px rgba(255,126,179,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      animation: bounceIn 0.5s 0.1s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes bounceIn {
      from { transform: scale(0); }
      to   { transform: scale(1); }
    }
    .result-img-circle img {
      width: 175px;
      height: 175px;
      object-fit: contain;
      filter: drop-shadow(0 8px 20px rgba(255,126,179,0.5));
    }

    .result-name {
      font-family: 'Fredoka One', cursive;
      font-size: 2rem;
      color: #fff;
      text-shadow: 0 0 30px rgba(201,160,245,0.8);
      opacity: 0;
      animation: fadeSlideIn 0.5s 0.5s ease forwards;
    }

    .result-continue {
      padding: 12px 40px;
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      color: #fff;
      background: rgba(255,255,255,0.1);
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      letter-spacing: 2px;
      opacity: 0;
      animation: fadeSlideIn 0.5s 0.7s ease forwards;
    }
    .result-continue:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.5); }

    /* Multi-result */
    .multi-results {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      max-width: 700px;
      padding: 10px;
    }
    .mini-result {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      animation: bounceIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    .mini-result-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,126,179,0.25), rgba(201,160,245,0.25));
      border: 2px solid rgba(255,255,255,0.2);
      box-shadow: 0 0 20px rgba(201,160,245,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .mini-result-circle img {
      width: 70px;
      height: 70px;
      object-fit: contain;
    }
    .mini-result-name {
      font-size: 0.7rem;
      font-weight: 800;
      color: rgba(255,255,255,0.7);
    }

    /* Gacha-intro */
    #gachaIntroModal {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #gachaIntroModal.open {
      opacity: 1;
      pointer-events: all;
    }

    .intro-video-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .skip-intro-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 10px 24px;
      background: rgba(0,0,0,0.7);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50px;
      color: white;
      font-family: 'Fredoka One', cursive;
      font-size: 1rem;
      cursor: pointer;
      z-index: 1001;
      transition: all 0.2s;
    }

    .skip-intro-btn:hover {
      background: rgba(255,255,255,0.2);
      transform: scale(1.05);
    }

    /* Mythical Quote Screen */
    .quote-screen {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1002;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .quote-screen.open {
      opacity: 1;
      pointer-events: all;
    }

    .quote-text {
      text-align: center;
      font-family: 'Fredoka One', cursive;
      font-size: 2rem;
      color: #fff;
      text-shadow: 0 0 20px rgba(255,255,255,0.5);
      animation: fadeInScale 0.5s ease forwards;
      padding: 20px;
    }

    @keyframes flashWhite {
      0% { background: #000; }
      50% { background: #fff; }
      100% { background: #000; }
    }

    .flash-effect {
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 1003;
      animation: flashWhite 3s ease-out forwards;
      pointer-events: none;
    }

    /* Gacha Animation Styles */
    @keyframes fadeInScale {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes blurIn {
      0% { opacity: 0; filter: blur(20px); }
      100% { opacity: 1; filter: blur(0); }
    }

    @keyframes slideInRight {
      0% { opacity: 0; transform: translateX(100px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    /* Typewriter effect */
    .typewriter-text {
      overflow: hidden;
      white-space: nowrap;
      margin: 0 auto;
      animation: typing 3s steps(40, end) forwards;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    /* For multi-line quotes */
    .typewriter-multi {
      overflow: hidden;
      border-right: 2px solid #fff;
      white-space: nowrap;
      margin: 0 auto;
      animation: typing 3s steps(40, end) forwards, blink-caret 0.75s step-end infinite;
    }

    @keyframes blink-caret {
      from, to { border-color: transparent; }
      50% { border-color: #fff; }
    }

    .gacha-animation-container {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(30,10,80,0.97) 0%, rgba(5,2,20,0.98) 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .gacha-animation-container.open {
      opacity: 1;
      pointer-events: all;
    }

    .animation-fullscreen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: fadeInScale 0.5s ease forwards;
    }

    /* For mythical - fullscreen */
    .animation-video-fullscreen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: blurIn 3s ease-out forwards;
    }

    .animation-centered {
      max-width: 80%;
      max-height: 80%;
      width: auto;
      height: auto;
      object-fit: contain;
      animation: fadeInScale 0.5s ease forwards;
      position: relative;
    }

    .animation-center-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    .rarity-info {
      position: fixed;
      right: 50px;
      top: 50%;
      transform: translateY(-50%);
      text-align: right;
      animation: slideInRight 0.5s ease forwards;
      z-index: 1001;
      padding: 20px 30px;
    }

    .rarity-name {
      font-family: 'Fredoka One', cursive;
      font-size: 2rem;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .character-name {
      font-family: 'Fredoka One', cursive;
      font-size: 3rem;
      letter-spacing: 2px;
    }

    .next-animation-btn {
      position: fixed;
      bottom: 50px;
      right: 50px;
      left: auto;
      transform: none;
      padding: 12px 40px;
      background: linear-gradient(135deg, var(--lavender), var(--sky));
      border: none;
      border-radius: 50px;
      color: white;
      font-family: 'Fredoka One', cursive;
      font-size: 1.2rem;
      cursor: pointer;
      animation: fadeInScale 0.5s 0.3s ease forwards;
      opacity: 0;
      z-index: 1003;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .next-animation-btn:hover {
      transform: scale(1.05);
    }

    /* ─── Volume widget ─────────────────────────────────────── */
    #volumeWidget {
      position: fixed;
      bottom: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 150;
    }
    .vol-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      color: rgba(255,255,255,0.7);
      transition: background 0.2s;
    }
    .vol-btn:hover { background: rgba(255,255,255,0.15); }
    .vol-slider-wrap {
      width: 0;
      overflow: hidden;
      transition: width 0.3s ease;
      display: flex;
      align-items: center;
    }
    #volumeWidget:hover .vol-slider-wrap { width: 100px; }
    #volumeSlider {
      -webkit-appearance: none;
      width: 90px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.2);
      outline: none;
      cursor: pointer;
    }
    #volumeSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--lavender);
      cursor: pointer;
    }

    /* ─── Confetti ───────────────────────────────────────────── */
    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      pointer-events: none;
      animation: confettiFall var(--cf-dur) ease-in forwards;
      z-index: 999;
    }
    @keyframes confettiFall {
      0%   { transform: translate(0,0) rotate(0deg); opacity: 1; }
      100% { transform: translate(var(--cf-x), var(--cf-y)) rotate(var(--cf-r)); opacity: 0; }
    }

    /* ─── Toast ──────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(255,60,60,0.15);
      border: 1px solid rgba(255,80,80,0.3);
      color: rgba(255,180,180,1);
      padding: 10px 24px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ─── Responsive ─────────────────────────────────────────── */
    @media (max-width: 640px) {
      .modal-body { flex-direction: column; }
      .spin-panel { width: 100%; flex-direction: row; flex-wrap: wrap; }
      .spin-card { flex: 1; min-width: 120px; }
      #gachaModal .modal-inner, #shopModal .shop-inner, #charSelectModal .shop-inner { border-radius: 20px; }
      .hud { padding: 12px 16px; }
      .hud-right { gap: 6px; }
    }
  </style>
</head>
<body>

<!-- Stars -->
<canvas id="stars"></canvas>

<!-- Atmospheric bubbles -->
<div class="bubble" style="width:400px;height:400px;background:var(--lavender);top:-100px;left:-100px;--d:8s;--tx:30px;--ty:20px;"></div>
<div class="bubble" style="width:300px;height:300px;background:var(--pink);bottom:-80px;right:-80px;--d:10s;--tx:-20px;--ty:-30px;"></div>
<div class="bubble" style="width:250px;height:250px;background:var(--sky);bottom:20%;left:20%;--d:12s;--tx:40px;--ty:-20px;"></div>

<!-- Audio -->
<audio id="clickSound" src="Sounds/tap.wav" preload="auto"></audio>
<audio id="bgMusic" src="Sounds/系ぎて.mp3" autoplay loop></audio>

<!-- ══ TITLE SCREEN ══════════════════════════════════════════ -->
<div class="screen" id="titleScreen">
  <div class="title-logo">MaiGacha</div>
  <div class="title-sub">Collect &bull; Spin &bull; Discover</div>

  <div class="mascot-wrap">
    <div class="mascot-glow"></div>
    <!-- Decorative rings -->
    <div class="ring" style="inset:-40px;border-color:rgba(201,160,245,0.15);--rs:12s;"></div>
    <div class="ring" style="inset:-28px;border-color:rgba(255,126,179,0.12);--rs:8s;animation-direction:reverse;"></div>
    <div class="mascot-orb" onclick="startGame()">
      <img src="Images/Derakkuma.webp" alt="Mascot" onerror="this.style.fontSize='4rem';this.removeAttribute('src');this.parentElement.style.fontSize='4rem'">
    </div>
  </div>

  <button class="start-btn" onclick="startGame()">✦ START ✦</button>
</div>

<!-- ══ CLICKER SCREEN ════════════════════════════════════════ -->
<div class="screen hidden" id="clickerScreen">

  <!-- HUD -->
  <div class="hud">
    <div class="hud-title">✦ MaiGacha</div>
    <div class="hud-right">
      <div class="click-counter">
        <span class="click-icon">⭐</span>
        <span class="click-value" id="clickDisplay">100</span>
      </div>
      <button class="char-select-btn" onclick="openCharSelect()">🔄 Switch</button>
      <button class="shop-hud-btn" onclick="openShop()">🛒 Shop</button>
      <button class="gacha-hud-btn" onclick="openGacha()">🎲 Gacha</button>
    </div>
  </div>

  <!-- Main clicker -->
  <div class="clicker-area">
    <div class="click-prompt">Tap to collect stars</div>

    <div class="clicker-btn" id="clickerBtn" onclick="handleClick(event)">
      <div class="clicker-aura"></div>
      <div class="clicker-ring" style="inset:-50px;border-color:rgba(255,255,255,0.04);"></div>
      <div class="clicker-ring" style="inset:-30px;border-color:rgba(255,255,255,0.06);"></div>
      <div class="clicker-circle">
        <img src="Images/Derakkuma.webp" alt="Character" id="clickerImg"
             onerror="this.style.fontSize='5rem';this.removeAttribute('src')">
      </div>
      <div class="boost-indicator" id="boostBadge" style="display:none;"></div>
    </div>

    <!-- Progress to 10 clicks -->
    <div class="progress-wrap">
      <div class="progress-labels">
        <span>Progress to Spin</span>
        <span id="progressLabel">0 / 10</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>
  </div>
</div>

<!-- ══ GACHA MODAL ═══════════════════════════════════════════ -->
<div id="gachaModal">
  <div class="modal-inner">
    <div class="modal-header">
      <div class="modal-title">✦ Gacha Summon</div>
      <button class="close-btn" onclick="closeGacha()">✕</button>
    </div>

    <div class="banner-tabs" id="bannerTabs">
      <button class="banner-tab active" onclick="selectBanner(0,this)">⏳ Limited</button>
      <button class="banner-tab" onclick="selectBanner(1,this)">🌸 Standard</button>
    </div>

    <div class="modal-body">
      <div class="banner-preview">
        <div class="banner-img-wrap">
          <img src="Images/maimaiBanner.png" id="bannerImage" alt="Banner" onerror="this.style.display='none'">
          <div class="banner-badge">⚡ LIMITED</div>
        </div>
        <div class="banner-name" id="bannerName"></div>
        <div class="banner-desc" id="bannerDesc"></div>
      </div>

      <div class="spin-panel">
        <div class="balance-display">
          <div class="balance-label">Your Stars</div>
          <div class="balance-value" id="modalBalance">0</div>
        </div>

        <div class="spin-card">
          <div class="spin-card-title">× 1 Spin</div>
          <div class="spin-card-cost">⭐ 10 Stars</div>
          <button class="spin-btn single" id="spinBtn1x" onclick="doSpin(1)">Pull ×1</button>
        </div>

        <div class="spin-card">
          <div class="spin-card-title">×10 Spin</div>
          <div class="spin-card-cost">⭐ 100 Stars</div>
          <button class="spin-btn multi" id="spinBtn10x" onclick="doSpin(10)">Pull ×10</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ══ SHOP MODAL ════════════════════════════════════════════ -->
<div id="shopModal">
  <div class="shop-inner">
    <div class="modal-header">
      <div class="modal-title" style="background: linear-gradient(135deg, var(--mint), var(--yellow)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">🛒 Shop</div>

<!-- Volume -->

<script>
/* ─────────────────── CONFIG ─────────────────── */
const banners = [
  { name: "Straight into the lights", desc: "Acid (★★★★★ Mythical) rate up banner is currently available for a limited period of time!", video: "Videos/AcidBanner.mp4", type: "video" },
  { name: "Standard Banner", desc: "What are you waiting for? Collect cute and adorable maimai characters now!", img: "Images/maimaiBanner.png", type: "image" },
];
const characters = [
  { name: "Derakkuma", img: "Images/Derakkuma.webp", rarity: "★ Common", id: "derakkuma" },
  { name: "Ras", img: "Images/Ras.webp", rarity: "★★ Rare", id: "ras" },
  { name: "Shama", img: "Images/Shama.webp", rarity: "★★★ Epic", id: "shama" },
  { name: "Chiffon", img: "Images/Chiffon.webp", rarity: "★★★★ Legendary", id: "chiffon" },
  { name: "Acid", img: "Images/Acid.webp", rarity: "★★★★★ Mythical", id: "acid" },
];

const mythicalQuotes = {
    "acid": {
      text: "I am the storm that approaches...",
      audio: "Audio/acidQuote.mp3"
    }
  };

const SPIN1_COST  = 10;
const SPIN10_COST = 100;

/* ─────────────────── SHOP ITEMS ──────────────── */
const shopItems = [
  {
    id: "click_boost",
    name: "Click Boost",
    desc: "Double your click power for 30 seconds",
    icon: "⚡",
    cost: 50,
    type: "boost",
    duration: 30000, // 30 seconds
    multiplier: 2
  },
  {
    id: "auto_clicker",
    name: "Auto Clicker",
    desc: "Automatically clicks 1 stars for 30 seconds",
    icon: "🤖",
    cost: 100,
    type: "auto",
    duration: 30000,
    interval: 250,
    clicksPerTick: 1
  },
  {
    id: "super_boost",
    name: "Super Boost",
    desc: "Triple your click power for 15 seconds",
    icon: "💥",
    cost: 150,
    type: "boost",
    duration: 15000,
    multiplier: 3
  },
  {
    id: "lucky_charm",
    name: "Lucky Charm",
    desc: "50% chance to get double stars per click for 20 seconds",
    icon: "🍀",
    cost: 80,
    type: "luck",
    duration: 20000,
    chance: 0.5,
    multiplier: 2
  }
];

/* ─────────────────── STATE ──────────────────── */
let count   = 100;
let muted   = false;
let prevVol = 1;

// Character collection
let ownedCharacters = new Set(["derakkuma"]); // Default character
let currentCharacter = {
  id: "derakkuma",
  name: "Derakkuma",
  img: "Images/Derakkuma.webp",
  rarity: "★ Common"
};

// Active boosts
let activeBoosts = {
  clickMultiplier: 1,
  autoClicker: null,
  luckyCharm: null
};

// Auto clicker interval reference
let autoClickerInterval = null;

// Gacha animation 
let currentAnimationPicks = [];
let animationInterval = null;
let animationSkip = false;

/* ─────────────────── AUDIO ──────────────────── */
const clickSound = document.getElementById("clickSound");
const bgMusic    = document.getElementById("bgMusic");
const volSlider  = document.getElementById("volumeSlider");
bgMusic.volume   = 0.25;

volSlider.addEventListener("input", () => {
  const v = parseFloat(volSlider.value);
  clickSound.volume = v;
  bgMusic.volume    = v * 0.25;
  muted = v === 0;
  document.getElementById("volBtn").textContent = muted ? "🔇" : "🔊";
});

function toggleMute() {
  muted = !muted;
  if (muted) {
    prevVol = parseFloat(volSlider.value) || 1;
    volSlider.value   = 0;
    clickSound.volume = 0;
    bgMusic.volume    = 0;
    document.getElementById("volBtn").textContent = "🔇";
  } else {
    volSlider.value   = prevVol;
    clickSound.volume = prevVol;
    bgMusic.volume    = prevVol * 0.25;
    document.getElementById("volBtn").textContent = "🔊";
  }
}

/* ─────────────────── STARS BG ────────────────── */
(function initStars() {
  const canvas = document.getElementById("stars");
  const ctx    = canvas.getContext("2d");
  let stars    = [];

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener("resize", resize);

  for (let i = 0; i < 180; i++) {
    stars.push({
      x:   Math.random() * window.innerWidth,
      y:   Math.random() * window.innerHeight,
      r:   Math.random() * 1.5 + 0.3,
      a:   Math.random(),
      da:  (Math.random() * 0.005 + 0.002) * (Math.random() < 0.5 ? 1 : -1),
    });
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      s.a += s.da;
      if (s.a <= 0 || s.a >= 1) s.da *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${s.a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ─────────────────── TITLE → GAME ───────────── */
function startGame() {
  const title   = document.getElementById("titleScreen");
  const clicker = document.getElementById("clickerScreen");
  title.classList.add("hidden");
  setTimeout(() => {
    title.style.display = "none";
    clicker.classList.remove("hidden");
  }, 600);
}

/* ─────────────────── CLICKER ────────────────── */
function handleClick(e) {
  let clicksToAdd = activeBoosts.clickMultiplier || 1;
  
  // Lucky charm logic
  if (activeBoosts.luckyCharm && Math.random() < activeBoosts.luckyCharm.chance) {
    clicksToAdd *= activeBoosts.luckyCharm.multiplier;
    spawnFloatNum(e.clientX - 20, e.clientY - 40, `+${clicksToAdd} 🍀`);
  }
  
  count += clicksToAdd;
  updateDisplay();
  playClick();
  
  if (clicksToAdd === 1) {
    spawnFloatNum(e.clientX, e.clientY, "+1");
  } else {
    spawnFloatNum(e.clientX, e.clientY, `+${clicksToAdd} ⚡`);
  }
  
  spawnSparks(e.clientX, e.clientY);
  updateProgress();
}

function playClick() {
  clickSound.currentTime = 0;
  clickSound.play().catch(() => {});
}

function updateDisplay() {
  const el = document.getElementById("clickDisplay");
  el.textContent = count;
  el.classList.remove("pop");
  void el.offsetWidth;
  el.classList.add("pop");
  document.getElementById("modalBalance").textContent = count;
  updateSpinBtns();
  updateShopButtons();
}

function updateProgress() {
  const target = SPIN1_COST;
  const pct    = Math.min((count % target) / target * 100, 100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressLabel").textContent = `${count % target} / ${target}`;
}

function spawnFloatNum(x, y, text = "+1") {
  const el = document.createElement("div");
  el.className   = "float-num";
  el.textContent = text;
  el.style.left  = (x - 16) + "px";
  el.style.top   = (y - 20) + "px";
  document.body.appendChild(el);
  el.addEventListener("animationend", () => el.remove());
}

function spawnSparks(x, y) {
  const colors = ["#ff7eb3","#c9a0f5","#6ec6ff","#ffe066","#7ee8c8"];
  for (let i = 0; i < 8; i++) {
    const el  = document.createElement("div");
    const ang = (i / 8) * Math.PI * 2 + Math.random() * 0.5;
    const dist = 40 + Math.random() * 40;
    el.className = "spark";
    el.style.left = (x - 4) + "px";
    el.style.top  = (y - 4) + "px";
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.setProperty("--sx", Math.cos(ang) * dist + "px");
    el.style.setProperty("--sy", Math.sin(ang) * dist + "px");
    document.body.appendChild(el);
    el.addEventListener("animationend", () => el.remove());
  }
}

/* ─────────────────── BOOST MANAGEMENT ───────── */
function activateBoost(item) {
  if (count < item.cost) {
    showToast(`Need ${item.cost} ⭐ stars!`);
    return false;
  }
  
  count -= item.cost;
  updateDisplay();
  
  switch(item.type) {
    case "boost":
      activeBoosts.clickMultiplier = item.multiplier;
      updateBoostBadge(`×${item.multiplier}`, item.duration);
      setTimeout(() => {
        activeBoosts.clickMultiplier = 1;
        updateBoostBadge(null);
      }, item.duration);
      break;
      
    case "auto":
      if (autoClickerInterval) clearInterval(autoClickerInterval);
      updateBoostBadge("🤖", item.duration);
      
      // Get the clicker button element for shake effect
      const clickerBtn = document.getElementById("clickerBtn");
      const clickerCircle = clickerBtn.querySelector('.clicker-circle');
      const rect = clickerBtn.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      
      autoClickerInterval = setInterval(() => {
        count += item.clicksPerTick;
        updateDisplay();
        updateProgress();
        playClick(); // Sound effect
        
        // Add shake effect to the clicker circle
        if (clickerCircle) {
          clickerCircle.style.transform = 'scale(0.92)';
          setTimeout(() => {
            clickerCircle.style.transform = '';
          }, 100);
        }
        
        // Add shake effect to the image inside
        const clickerImg = document.getElementById("clickerImg");
        if (clickerImg) {
          clickerImg.style.transform = 'scale(0.9) rotate(-5deg)';
          setTimeout(() => {
            clickerImg.style.transform = '';
          }, 100);
        }
        
        spawnFloatNum(centerX, centerY, `+${item.clicksPerTick} 🤖`); // Visual number
        spawnSparks(centerX, centerY); // Spark particles
      }, item.interval);
      
      setTimeout(() => {
        clearInterval(autoClickerInterval);
        autoClickerInterval = null;
        updateBoostBadge(null);
      }, item.duration);
      break;

    case "luck":
      activeBoosts.luckyCharm = { chance: item.chance, multiplier: item.multiplier };
      updateBoostBadge("🍀", item.duration);
      setTimeout(() => {
        activeBoosts.luckyCharm = null;
        updateBoostBadge(null);
      }, item.duration);
      break;
  }
  
  showToast(`Activated ${item.name}!`, true);
  return true;
}

function updateBoostBadge(text, duration) {
  const badge = document.getElementById("boostBadge");
  if (text) {
    badge.textContent = text;
    badge.style.display = "block";
    if (duration) {
      let remaining = duration / 1000;
      const countdown = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(countdown);
          badge.style.display = "none";
        } else {
          badge.textContent = `${text} ${remaining}s`;
        }
      }, 1000);
    }
  } else {
    badge.style.display = "none";
  }
}

/* ─────────────────── GACHA MODAL ────────────── */
function openGacha() {
  document.getElementById("modalBalance").textContent = count;
  updateSpinBtns();
  document.getElementById("gachaModal").classList.add("open");
  
  // Ensure limited banner is shown first
  const limitedTab = document.querySelectorAll(".banner-tab")[0];
  if (limitedTab && limitedTab.classList.contains("active")) {
    selectBanner(0, limitedTab);
  }
}
function closeGacha() {
  document.getElementById("gachaModal").classList.remove("open");
}

function selectBanner(idx, btn) {
  document.querySelectorAll(".banner-tab").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  const b = banners[idx];
  
  // Only replace the image/video inside banner-img-wrap, keep the badge
  const bannerImgWrap = document.querySelector(".banner-img-wrap");
  const badge = bannerImgWrap.querySelector(".banner-badge");
  
  if (b.type === "video") {
    // Keep the badge, replace only the media content
    bannerImgWrap.innerHTML = `<div class="banner-badge">⚡ LIMITED</div><video src="${b.video}" autoplay loop muted style="width:100%; height:100%; object-fit:cover;"></video>`;
  } else {
    bannerImgWrap.innerHTML = `<div class="banner-badge">⚡ LIMITED</div><img src="${b.img}" alt="Banner" onerror="this.style.display='none'">`;
  }
  
  document.getElementById("bannerName").textContent = b.name;
  document.getElementById("bannerDesc").textContent = b.desc;
  
  // Show/hide limited badge
  const newBadge = document.querySelector(".banner-badge");
  if (idx === 0) { // Limited banner
    newBadge.style.display = "flex";
  } else { // Standard banner
    newBadge.style.display = "none";
  }
}

function updateSpinBtns() {
  document.getElementById("spinBtn1x").disabled  = count < SPIN1_COST;
  document.getElementById("spinBtn10x").disabled = count < SPIN10_COST;
}

/* ─────────────────── SPIN LOGIC ─────────────── */
function doSpin(times) {
  const cost = times === 1 ? SPIN1_COST : SPIN10_COST;
  if (count < cost) { showToast(`Need ${cost} ⭐ stars!`); return; }

  count -= cost;
  updateDisplay();
  closeGacha();

  // Store spin info for after video
  window.pendingSpin = times;
  
  // Show intro video
  showGachaIntro();
}

function showGachaIntro() {
  const introModal = document.getElementById("gachaIntroModal");
  const video = document.getElementById("gachaIntroVideo");
  
  introModal.classList.add("open");
  video.currentTime = 0;
  video.play();
  
  // When video ends, perform the spin
  video.onended = function() {
    performSpin();
  };
  
  // Skip button
  const skipBtn = document.getElementById("skipIntroBtn");
  skipBtn.onclick = function() {
    video.pause();
    performSpin();
  };
}

function performSpin() {
  // Close intro modal
  document.getElementById("gachaIntroModal").classList.remove("open");
  
  const times = window.pendingSpin;
  const picks = [];
  
  for (let i = 0; i < times; i++) {
    const char = getRandomCharacterByRarity();
    picks.push(char);
    ownedCharacters.add(char.id);
  }
  
  if (times === 1) {
    showAnimatedResults(picks);
  } else {
    showAnimatedResults(picks);
  }
  
  window.pendingSpin = null;
}

let animationQueue = [];
let currentAnimationIndex = 0;

function showAnimatedResults(picks) {
  animationQueue = picks;
  currentAnimationIndex = 0;
  showNextAnimation();
}

function showNextAnimation() {
  if (currentAnimationIndex >= animationQueue.length) {
    // All animations done, show final results
    document.getElementById("gachaAnimationContainer").classList.remove("open");
    showResults(animationQueue);
    return;
  }
  
  const char = animationQueue[currentAnimationIndex];
  const container = document.getElementById("gachaAnimationContainer");
  const mediaDiv = document.getElementById("animationMedia");
  const rarityInfo = document.getElementById("rarityInfo");
  const nextBtn = document.getElementById("nextAnimationBtn");
  
  // Clear previous content
  mediaDiv.innerHTML = "";
  rarityInfo.innerHTML = "";
  nextBtn.style.display = "none";
  
  // Reset rarity info opacity (hide it initially)
  rarityInfo.style.opacity = "0";
  rarityInfo.style.animation = "none";
  
  // Set rarity color
  let rarityColor = "";
  let rarityText = "";
  switch(char.rarity) {
    case "★ Common":
      rarityColor = "#a0a0a0";
      rarityText = "COMMON";
      break;
    case "★★ Rare":
      rarityColor = "#4caf50";
      rarityText = "RARE";
      break;
    case "★★★ Epic":
      rarityColor = "#2196f3";
      rarityText = "EPIC";
      break;
    case "★★★★ Legendary":
      rarityColor = "#ff9800";
      rarityText = "LEGENDARY";
      break;
    case "★★★★★ Mythical":
      rarityColor = "#ff0000";
      rarityText = "MYTHICAL";
      break;
  }
  
  // Show rarity info on the right (but hidden initially)
  rarityInfo.innerHTML = `
    <div class="rarity-name" style="color: ${rarityColor};">✦ ${rarityText} ✦</div>
    <div class="character-name" style="color: #fff; text-shadow: 0 0 20px ${rarityColor};">${char.name}</div>
  `;
  
  if (char.rarity === "★★★★★ Mythical") {
    // Mythical: Show quote intro first
    showMythicalIntro(char);
  } else {
    // Other rarities: Centered image
    mediaDiv.innerHTML = `
      <div class="animation-center-wrapper">
        <img src="${char.img}" class="animation-centered" alt="${char.name}">
      </div>
    `;
    container.classList.add("open");
    playClick();
    
    // Fade in rarity info after a delay (same timing as next button)
    setTimeout(() => {
      rarityInfo.style.animation = "fadeInScale 0.5s ease forwards";
      rarityInfo.style.opacity = "1";
      nextBtn.style.display = "block";
    }, 100);
  }
  
  // Setup next button
  nextBtn.onclick = () => {
    currentAnimationIndex++;
    showNextAnimation();
  };
}

function showMythicalIntro(char) {
  const container = document.getElementById("gachaAnimationContainer");
  const mediaDiv = document.getElementById("animationMedia");
  const nextBtn = document.getElementById("nextAnimationBtn");
  const rarityInfo = document.getElementById("rarityInfo");
  
  // Hide next button and rarity info during intro
  nextBtn.style.display = "none";
  rarityInfo.style.opacity = "0";
  rarityInfo.style.animation = "none";
  
  // Reset rarity info content
  let rarityColor = "#ff0000";
  let rarityText = "MYTHICAL";
  
  rarityInfo.innerHTML = `
    <div class="rarity-name" style="color: ${rarityColor};">✦ ${rarityText} ✦</div>
    <div class="character-name" style="color: #fff; text-shadow: 0 0 20px ${rarityColor};">${char.name}</div>
  `;
  
 // Create quote screen with typewriter effect
  const quoteScreen = document.createElement("div");
  quoteScreen.className = "quote-screen";

  const quoteText = mythicalQuotes[char.id]?.text || "Witness my power!";

  // Calculate animation duration based on text length (slower for longer text)
  const animationDuration = Math.max(2, quoteText.length / 10);

  quoteScreen.innerHTML = `
    <div class="quote-text">
      <div class="typewriter-text" style="animation: typing ${animationDuration}s steps(${quoteText.length}, end) forwards;">
        "${quoteText}"
      </div>
    </div>
  `;

  document.body.appendChild(quoteScreen);
  
  // Play quote audio
  const quoteAudio = new Audio(mythicalQuotes[char.id]?.audio || "Audio/defaultQuote.mp3");
  quoteAudio.play().catch(() => {});
  
  // Show quote screen
  setTimeout(() => {
    quoteScreen.classList.add("open");
  }, 100);
  
  // After quote, flash white
  setTimeout(() => {
    // Create flash effect
    const flash = document.createElement("div");
    flash.className = "flash-effect";
    document.body.appendChild(flash);
    
    // Remove quote screen
    quoteScreen.classList.remove("open");
    setTimeout(() => quoteScreen.remove(), 500);
    
    // After flash, show the mythical video
    setTimeout(() => {
      flash.remove();
      
      // Show mythical fullscreen video
      mediaDiv.innerHTML = `<video src="Videos/${char.id}Banner.mp4" class="animation-video-fullscreen" autoplay loop muted></video>`;
      container.classList.add("open");
      
      // Fade in rarity info after video starts
      setTimeout(() => {
        rarityInfo.style.animation = "fadeInScale 0.5s ease forwards";
        rarityInfo.style.opacity = "1";
        nextBtn.style.display = "block";
      }, 3000);
    }, 1500);
  }, 5000);
}

function skipAnimation() {
  animationSkip = true;
  if (animationInterval) {
    clearInterval(animationInterval);
    animationInterval = null;
  }
  showResults(currentAnimationPicks);
}

function getRandomCharacterByRarity() {
  // Check which banner is active (0 = Limited, 1 = Standard)
  const activeTab = document.querySelector(".banner-tab.active");
  const isLimitedBanner = activeTab && activeTab.textContent.includes("Limited");
  
  // Filter characters based on banner
  let availableCharacters = characters;
  if (!isLimitedBanner) {
    // Exclude Acid (Mythical) from standard banner
    availableCharacters = characters.filter(c => c.id !== "acid");
  }
  
  // Define rarity chances
  const rarityChances = {
    "★★★★★ Mythical": 0.20,  // 1% chance
    "★★★★ Legendary": 0.04,  // 4% chance  
    "★★★ Epic": 0.25,        // 25% chance
    "★★ Rare": 0.50,         // 50% chance
    "★ Common": 0.01         // 20% chance
  };
  
  // Roll for rarity
  const roll = Math.random();
  let selectedRarity = null;
  let cumulativeChance = 0;
  
  for (const [rarity, chance] of Object.entries(rarityChances)) {
    cumulativeChance += chance;
    if (roll < cumulativeChance) {
      selectedRarity = rarity;
      break;
    }
  }
  
  // Filter characters by selected rarity AND banner availability
  const availableChars = availableCharacters.filter(c => c.rarity === selectedRarity);
  
  // If no characters of that rarity (fallback), return random from available
  if (availableChars.length === 0) {
    return availableCharacters[Math.floor(Math.random() * availableCharacters.length)];
  }
  
  // Pick random from available characters of that rarity
  return availableChars[Math.floor(Math.random() * availableChars.length)];
}

function showResults(picks) {
  const overlay = document.getElementById("resultOverlay");
  const card    = document.getElementById("resultCard");
  card.innerHTML = "";

  if (picks.length === 1) {
    const c = picks[0];
    card.innerHTML = `
      <div class="result-rarity">${c.rarity} - NEW!</div>
      <div class="result-img-wrap">
        <div class="result-glow"></div>
        <div class="result-img-circle">
          <img src="${c.img}" alt="${c.name}" onerror="this.style.fontSize='4rem';this.removeAttribute('src')">
        </div>
      </div>
      <div class="result-name">${c.name}</div>
      <button class="result-continue" onclick="closeResult()">Continue ✦</button>
    `;
  } else {
    const items = picks.map((c, i) => `
      <div class="mini-result" style="animation-delay:${i * 0.07}s">
        <div class="mini-result-circle">
          <img src="${c.img}" alt="${c.name}" onerror="this.style.fontSize='2rem';this.removeAttribute('src')">
        </div>
        <div class="mini-result-name">${c.name}</div>
      </div>
    `).join("");

    card.innerHTML = `
      <div class="result-rarity" style="margin-bottom:8px">✦ 10-Pull Results ✦</div>
      <div class="multi-results">${items}</div>
      <button class="result-continue" style="margin-top:16px;opacity:0;animation:fadeSlideIn 0.5s 0.9s ease forwards;" onclick="closeResult()">Continue ✦</button>
    `;
  }

  overlay.classList.add("open");
  spawnConfetti();
}

function closeResult() {
  document.getElementById("resultOverlay").classList.remove("open");
}

/* ─────────────────── SHOP MODAL ─────────────── */
function openShop() {
  renderShop();
  document.getElementById("shopModal").classList.add("open");
}

function closeShop() {
  document.getElementById("shopModal").classList.remove("open");
}

function renderShop() {
  const grid = document.getElementById("shopGrid");
  grid.innerHTML = "";
  
  shopItems.forEach(item => {
    const card = document.createElement("div");
    card.className = "shop-item";
    card.innerHTML = `
      <div class="shop-item-icon">${item.icon}</div>
      <div class="shop-item-name">${item.name}</div>
      <div class="shop-item-desc">${item.desc}</div>
      <div class="shop-item-cost">⭐ ${item.cost}</div>
      <button class="shop-item-btn" 
              onclick="activateBoost(shopItems.find(i => i.id === '${item.id}'))"
              ${count < item.cost ? 'disabled' : ''}>
        Buy
      </button>
    `;
    grid.appendChild(card);
  });
}

function updateShopButtons() {
  // Update all shop buttons if shop is open
  const shopModal = document.getElementById("shopModal");
  if (shopModal.classList.contains("open")) {
    renderShop();
  }
}

/* ─────────────────── CHARACTER SELECT ────────── */
function openCharSelect() {
  renderCharSelect();
  document.getElementById("charSelectModal").classList.add("open");
}

function closeCharSelect() {
  document.getElementById("charSelectModal").classList.remove("open");
}

function renderCharSelect() {
  const grid = document.getElementById("charGrid");
  grid.innerHTML = "";
  
  // Just use characters array directly - no duplicate default
  const allChars = characters;
  
  allChars.forEach(char => {
    const isOwned = ownedCharacters.has(char.id);
    const isSelected = currentCharacter.id === char.id;
    
    const card = document.createElement("div");
    card.className = `char-card ${isSelected ? 'selected' : ''} ${!isOwned ? 'locked' : ''}`;
    card.innerHTML = `
      <div class="char-card-circle">
        ${isOwned 
          ? `<img src="${char.img}" alt="${char.name}" onerror="this.style.display='none'">`
          : '<div class="char-card-lock">🔒</div>'
        }
      </div>
      <div class="char-card-name">${char.name}</div>
      ${isOwned ? '<div style="font-size:0.6rem;color:rgba(255,255,255,0.4);margin-top:2px;">' + char.rarity + '</div>' : ''}
    `;
    
    if (isOwned) {
      card.onclick = () => selectCharacter(char);
    }
    
    grid.appendChild(card);
  });
}

function selectCharacter(char) {
  currentCharacter = char;
  
  // Update clicker image
  document.getElementById("clickerImg").src = char.img;
  
  // Update character name in prompt
  document.querySelector(".click-prompt").textContent = `Tap to collect stars - ${char.name}`;
  
  closeCharSelect();
  showToast(`Switched to ${char.name}!`, true);
}

/* ─────────────────── CONFETTI ────────────────── */
function spawnConfetti() {
  const colors = ["#ff7eb3","#c9a0f5","#6ec6ff","#ffe066","#7ee8c8","#fff"];
  for (let i = 0; i < 60; i++) {
    const el    = document.createElement("div");
    const color = colors[Math.floor(Math.random() * colors.length)];
    const x     = Math.random() * window.innerWidth;
    const dur   = 0.8 + Math.random() * 1.2;
    el.className = "confetti-piece";
    el.style.cssText = `
      left:${x}px; top:${Math.random() * 30}vh;
      background:${color}; border-radius:${Math.random() > 0.5 ? "50%" : "2px"};
      --cf-dur:${dur}s;
      --cf-x:${(Math.random() - 0.5) * 200}px;
      --cf-y:${80 + Math.random() * 60}vh;
      --cf-r:${Math.random() * 720}deg;
      animation-delay:${Math.random() * 0.3}s;
    `;
    document.body.appendChild(el);
    el.addEventListener("animationend", () => el.remove());
  }
}

/* ─────────────────── TOAST ──────────────────── */
function showToast(msg, success = false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  if (success) {
    t.style.background = "rgba(126,232,200,0.15)";
    t.style.borderColor = "rgba(126,232,200,0.3)";
    t.style.color = "rgba(180,255,220,1)";
  } else {
    t.style.background = "rgba(255,60,60,0.15)";
    t.style.borderColor = "rgba(255,80,80,0.3)";
    t.style.color = "rgba(255,180,180,1)";
  }
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}
</script>
